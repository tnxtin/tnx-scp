name: App de escritorio (Windows / macOS / Linux)

# Se ejecuta al publicar una etiqueta v* (p. ej. `git tag v0.1.0 && git push --tags`)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - host: windows-latest
            targets: 'x86_64-pc-windows-msvc'
          - host: ubuntu-22.04
            targets: 'x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.targets }}

      - name: Dependencias de Linux (webkit2gtk 4.1)
        if: matrix.settings.host == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependencias del frontend
        run: |
          cd desktop
          bun install

      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Tnx Pairing Chess System ${{ github.ref_name }}'
          releaseBody: 'Instaladores offline para Windows (.msi/.exe), macOS (.dmg) y Linux (AppImage/deb/rpm).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.settings.targets }}
