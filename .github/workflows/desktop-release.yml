name: App de escritorio (Windows / macOS / Linux)

# Se ejecuta al publicar una etiqueta v* (p. ej. `git tag v0.4.0 && git push origin v0.4.0`)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - host: windows-latest
            targets: 'x86_64-pc-windows-msvc'
          - host: ubuntu-22.04
            targets: 'x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.targets }}

      - name: Dependencias de Linux (webkit2gtk 4.1)
        if: matrix.settings.host == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependencias del frontend
        working-directory: desktop
        run: bun install

      - name: Compilar y empaquetar
        working-directory: desktop
        run: bunx tauri build --target ${{ matrix.settings.targets }}

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Tnx · Social Chess Pairing ${{ github.ref_name }}'
          body: 'Instaladores offline para Windows (.msi/.exe), macOS (.dmg) y Linux (AppImage/deb/rpm).'
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/**/bundle/**/*.AppImage
            desktop/src-tauri/target/**/bundle/**/*.deb
            desktop/src-tauri/target/**/bundle/**/*.rpm
            desktop/src-tauri/target/**/bundle/**/*.exe
            desktop/src-tauri/target/**/bundle/**/*.msi
            desktop/src-tauri/target/**/bundle/**/*.dmg
