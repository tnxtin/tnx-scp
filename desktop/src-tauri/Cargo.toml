[package]
name = "tnxpcs-desktop"
version = "0.1.0"
description = "Tnx · Social Chess Pairing — emparejamiento de ajedrez offline por grupos progresivos"
license = "GPL-3.0-or-later"
authors = ["Tinux"]
edition = "2021"

[lib]
name = "tnxpcs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite", "mysql"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
